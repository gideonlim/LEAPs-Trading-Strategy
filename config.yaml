paper_trading: true
dry_run: false
log_level: INFO

strategy:
  underlying_preference: SPY     # SPY or auto (checks affordability)
  itm_depth_pct: 0.20            # strike = underlying × (1 - this)
  min_expiry_months: 12
  max_expiry_months: 18
  sell_threshold_fraction: 0.333  # sell when 1/3 of original DTE remains
  order_type: limit               # market or limit
  limit_offset_pct: 0.0           # fill aggression: 0.0 = at mid, 1.0 = at ask/bid. 0.0 places limit at mid-price

pricing:
  risk_free_rate: 0.037           # fallback 1Y treasury rate (update if FRED fetch fails)
  dividend_yield: 0.013           # fallback SPY dividend yield
  max_extrinsic_pct: 0.25         # reject if extrinsic > 25% of theoretical price
  price_divergence_warn_pct: 0.10 # warn if theoretical vs market diverge > 10%

allocation:
  quarterly_months: [3, 6, 9, 12]
  max_cash_deploy_pct: 1.0
  min_cash_reserve: 0.0
  allocation_window_days: 7     # only allocate within first N calendar days of quarter month
  bootstrap_on_first_run: true  # deploy capital immediately on first run (don't wait for quarterly window)

safety:
  no_trade_minutes_after_open: 60
  max_bid_ask_spread_pct: 0.15    # 15% — relaxed for indicative (delayed) feed; limit orders protect against bad fills
  min_open_interest: 10           # deep ITM LEAPs have thin OI; 10 is enough to confirm the contract is alive
  min_delta: 0.70                 # relaxed from 0.80 — indicative deltas can be stale by 0.05-0.10; real delta at 20% ITM is ~0.85+
  emergency_sell_days: 30
  stale_quote_warn_minutes: 15

data:
  feed: indicative                # indicative (free) or opra (paid)
