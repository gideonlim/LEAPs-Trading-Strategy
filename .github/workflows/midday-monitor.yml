name: LEAPs Bot Mid-Day Monitor

# Runs mid-session to confirm that morning orders have been executed.
# MONITOR-ONLY: reconciles pending orders but never submits new ones.
on:
  schedule:
    - cron: '30 14 * * 1-5'
      timezone: America/New_York    # 2:30 PM ET — several hours after morning fills
  workflow_dispatch:

concurrency:
  group: leaps-bot-run    # Shared with daily-check + eod-monitor — no overlap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  midday-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch bot state
        run: |
          mkdir -p data
          if git fetch origin bot-state:bot-state 2>/dev/null && git rev-parse --verify bot-state >/dev/null 2>&1; then
            git show bot-state:data/state.json > data/state.json 2>/dev/null || echo '{}' > data/state.json
          else
            echo '{}' > data/state.json
          fi

      - name: Reconcile pending orders (no snapshot)
        id: bot_monitor
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        # --no-snapshot: EOD workflow captures the canonical daily snapshot.
        run: leaps-bot monitor --no-snapshot --config config.yaml --state data/state.json
        continue-on-error: true

      - name: Push updated state
        if: always()
        run: |
          git config user.name "leaps-bot"
          git config user.email "leaps-bot@github-actions"

          STATE_TMP=$(mktemp)
          cp data/state.json "$STATE_TMP"

          if git fetch origin bot-state:bot-state 2>/dev/null && git rev-parse --verify bot-state >/dev/null 2>&1; then
            git checkout -f bot-state
            git pull --rebase origin bot-state || true
          else
            git checkout --orphan bot-state
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p data
          cp "$STATE_TMP" data/state.json

          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Mid-day monitor $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            PUSH_OK=0
            for i in 1 2 3; do
              if git push origin bot-state; then
                PUSH_OK=1
                break
              fi
              echo "Push attempt $i failed, refetching and retrying..."
              git pull --rebase origin bot-state || true
            done
            if [ "$PUSH_OK" -ne 1 ]; then
              echo "::error::Failed to push bot state after 3 attempts."
              exit 1
            fi
          else
            echo "No state changes to commit"
          fi

      - name: Fail if monitor failed
        if: steps.bot_monitor.outcome == 'failure'
        run: exit 1
