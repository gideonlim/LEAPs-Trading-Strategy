name: LEAPs Bot End-of-Day Monitor

on:
  schedule:
    - cron: '30 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

concurrency:
  group: leaps-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eod-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Reconcile + capture EOD snapshot
        id: bot_monitor
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: leaps-bot monitor --config config.yaml --state data/state.json
        continue-on-error: true

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "leaps-bot"
          git config user.email "leaps-bot@github-actions"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "EOD monitor $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            PUSH_OK=0
            for i in 1 2 3; do
              if git push origin main; then
                PUSH_OK=1
                break
              fi
              git pull --rebase origin main || true
            done
            if [ "$PUSH_OK" -ne 1 ]; then
              echo "::error::Failed to push state after 3 attempts."
              exit 1
            fi
          else
            echo "No state changes to commit"
          fi

      - name: Fail if monitor failed
        if: steps.bot_monitor.outcome == 'failure'
        run: exit 1
