name: LEAPs Bot Weekly Report

# Runs Saturday morning after the full trading week is done.
# Generates PDF performance report + trades CSV and emails them.
on:
  schedule:
    - cron: '0 9 * * 6'
      timezone: America/New_York    # 9:00 AM ET Saturday
  workflow_dispatch:                 # manual trigger for testing

concurrency:
  group: leaps-bot-run
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Capture fresh snapshot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: leaps-bot monitor --config config.yaml --state data/state.json
        continue-on-error: true

      - name: Commit updated state
        run: |
          git config user.name "leaps-bot"
          git config user.email "leaps-bot@github-actions"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly report snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Generate and email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          leaps-bot send-report \
            --to "$REPORT_EMAIL" \
            --config config.yaml \
            --state data/state.json
